                <option value="Grand'Anse">Grand'Anse</option>
                <option value="Nippes">Nippes</option>
                <option value="Nord">Nord</option>

                <option value="Nord-Ouest">Nord-Ouest</option>
                <option value="Ouest">Ouest</option>
                <option value="Sud">Sud</option>
                <option value="Sud-Est">Sud-Est</option>
              </select>
            </div>

            <div class="field">
              <label for="duree">Durée de voyage</label>
              <input type="number" id="duree" name="duree" class="input" min="1" step="1" placeholder="ex: 7" required>
            </div>

            <div class="field">
              <label for="date_depart">Date de départ</label>
              <input type="date" id="date_depart" name="date_depart" class="input" required>
            </div>

            <div class="field">
              <label for="passagers">Nombre de passagers</label>

            </div>

            <div class="field create-trip-span">

            </div>

  <script src="app.js" defer></script>
  <script>
    // Soumission simulée (si vous n'avez pas de backend)
    const form = document.getElementById('createTripForm');
    const result = document.getElementById('createTripResult');

    if (form && result) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        result.classList.remove('error');

        const nom = document.getElementById('nom')?.value?.trim() || '';
        const email = document.getElementById('email')?.value?.trim() || '';
        const destination = document.getElementById('destination')?.value?.trim() || '';
        const paysResidence = document.getElementById('pays_residence')?.value?.trim() || '';

        const dateDepart = document.getElementById('date_depart')?.value?.trim() || '';
        const passagers = document.getElementById('passagers')?.value?.trim() || '';
        const duree = document.getElementById('duree')?.value?.trim() || '';

        // Validation métier demandée
        const errors = [];

        if (!email.toLowerCase().endsWith('@gmail.com')) {
          errors.push('Votre email doit se terminer par @gmail.com.');
        }

        if (!destination) {
          errors.push('Veuillez choisir un département (destination).');
        }

        if (!paysResidence) {
          errors.push('Veuillez choisir votre pays de résidence.');
        }

        if (!dateDepart) {
          errors.push('Veuillez indiquer la date de départ.');
        }

        if (!passagers) {
          errors.push('Veuillez indiquer le nombre de passagers.');
        }

        if (!duree) {
          errors.push('Veuillez indiquer la durée de voyage.');
        }

        if (errors.length) {
          result.classList.add('error');
          result.textContent = errors[0];
          result.style.opacity = '1';
          return;
        }

        result.textContent = `Merci ${nom}! Demande reçue${destination ? ` pour ${destination}` : ''} on vous contactera par email pour la suite.`;
        result.style.opacity = '1';
        form.reset();
      });
    }
  </script>
